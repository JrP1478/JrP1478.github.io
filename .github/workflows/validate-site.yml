name: Validate site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - redesign-2026

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render product images
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[render-products]')
        run: npm run render:products

      - name: Build static site
        run: npm run build

      - name: Commit rendered product images
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[render-products]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/products
          if git diff --cached --quiet; then
            echo "No image changes to commit"
            exit 0
          fi
          git commit -m "Actualiza imágenes de producto renderizadas [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
