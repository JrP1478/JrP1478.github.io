name: Validate and deploy site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - redesign-2026
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recreate product images
        if: github.event_name == 'push' && github.ref_name == 'redesign-2026' && contains(github.event.head_commit.message, '[rebuild-product-images]')
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "opencv-contrib-python-headless==4.10.0.84" "Pillow>=10.4,<12"
          mkdir -p .cache
          curl -L --fail --retry 3 \
            -o .cache/FSRCNN_x4.pb \
            https://github.com/Saafke/FSRCNN_Tensorflow/raw/master/models/FSRCNN_x4.pb
          python3 scripts/rebuild-product-images.py

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Commit recreated product images
        if: github.event_name == 'push' && github.ref_name == 'redesign-2026' && contains(github.event.head_commit.message, '[rebuild-product-images]')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/products
          if git diff --cached --quiet; then
            echo "No product image changes to commit"
            exit 0
          fi
          git commit -m "Actualiza imágenes reconstruidas de productos [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref_name == 'main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist -b gh-pages
